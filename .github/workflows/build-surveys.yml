name: Build Survey Says

on:
  workflow_dispatch:

  schedule:
    - cron: "15 8 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build Survey Says
        run: npm run build

      - name: Run Odum diagnostic
        run: node scripts/test-odum.js

      - name: Commit updated Survey Says files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/ mjr-survey-rotation.json

          if git diff --cached --quiet; then
            echo "No Survey Says changes to commit."
          else
            git commit -m "Update MJR Survey Says"
            git push
          fi
