name: Build MJR Survey Says

on:
  workflow_dispatch:
  schedule:
    # 08:15 UTC daily. During EDT this is 4:15 a.m. ET.
    - cron: "15 8 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Survey Says feed and widget
        run: npm run build

      - name: Commit updated Survey Says files
        run: |
          git config user.name "mjr-survey-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/ mjr-survey-rotation.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Survey Says"
            git push
          fi
