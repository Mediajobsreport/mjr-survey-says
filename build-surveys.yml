name: Build MJR Survey Says

on:
  workflow_dispatch:
  schedule:
    # Runs before the MJR Prep production window every day.
    - cron: "15 8 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Survey Says feed
        run: npm run build

      - name: Commit updated feed
        run: |
          git config user.name "mjr-survey-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/surveys.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Survey Says feed"
            git push
          fi
